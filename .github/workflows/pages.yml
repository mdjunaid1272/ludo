# Builds the game and publishes it with GitHub Pages, so it can be opened from the browser at
#   https://<your-user>.github.io/<repository>/
# One-time setup on GitHub: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Pages only serves files, so the offline modes (Player vs Computer, Local Multiplayer) work there; Play Online needs the
# Node game server (see deploy/DEPLOY.md) and the address of it in deploy/config.js (window.LUDO_SERVER).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4